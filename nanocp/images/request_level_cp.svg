<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500">
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="28" y="36" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#1c2430">请求级上下文并行（CP）</text>
  <text x="28" y="60" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#5c6775">长请求的 KV 按 token 位置切开。每张卡持有全部头、一半上下文。原卡收回部分输出和 LSE 后再合并。</text>

  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="36" y="88" width="300" height="280" rx="10" fill="#f4f7fb" stroke="#d5deea"/>
    <rect x="424" y="88" width="300" height="280" rx="10" fill="#f4f7fb" stroke="#d5deea"/>

    <text x="186" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#1c2430">GPU 0 · 请求所在卡</text>
    <text x="574" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#1c2430">GPU 1 · KV 伙伴</text>

    <rect x="56" y="140" width="260" height="40" rx="6" fill="#d9e8fb"/>
    <text x="186" y="165" text-anchor="middle" font-size="14" fill="#1c2430">短请求 · 全部头 · 全上下文</text>
    <rect x="444" y="140" width="260" height="40" rx="6" fill="#d9e8fb"/>
    <text x="574" y="165" text-anchor="middle" font-size="14" fill="#1c2430">短请求 · 留在本卡</text>

    <rect x="56" y="204" width="260" height="88" rx="6" fill="#f6d7b8"/>
    <text x="186" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2430">长请求 KV · 前半段</text>
    <text x="186" y="258" text-anchor="middle" font-size="13" fill="#5c4030">token 0 … L/2</text>
    <text x="186" y="278" text-anchor="middle" font-size="13" fill="#5c4030">全部 Q / KV 头</text>

    <rect x="444" y="204" width="260" height="88" rx="6" fill="#f6d7b8"/>
    <text x="574" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2430">长请求 KV · 后半段</text>
    <text x="574" y="258" text-anchor="middle" font-size="13" fill="#5c4030">token L/2 … L</text>
    <text x="574" y="278" text-anchor="middle" font-size="13" fill="#5c4030">全部 Q / KV 头</text>

    <rect x="56" y="312" width="260" height="36" rx="6" fill="#e7f6ea" stroke="#b7dec0"/>
    <text x="186" y="335" text-anchor="middle" font-size="14" fill="#1c2430">LSE 合并后进入 MoE</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c05621"/>
    </marker>
    <marker id="arrowBack" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <path d="M316 222 H424" stroke="#c05621" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="370" y="214" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#c05621">全部 Q</text>
  <path d="M424 276 H316" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#arrowBack)"/>
  <text x="370" y="294" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#2b6cb0">O + LSE</text>

  <text x="36" y="412" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#1c2430">局部 softmax 不能直接相加。原卡合并：</text>
  <text x="36" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1c2430">L = log sum exp(Li) ,  O = sum exp(Li - L) * Oi</text>
</svg>
